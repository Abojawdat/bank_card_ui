name: bank_card_3d
description: >-
  Visa and Mastercard cards for Flutter, rendered in real 3D — photoreal or
  glass, every tier, a wallet stack, a live entry form, and a minting
  animation. Zero dependencies, all six platforms.
version: 0.1.0
homepage: https://abojawdat.github.io/bank_card_ui/
repository: https://github.com/Abojawdat/bank_card_ui
issue_tracker: https://github.com/Abojawdat/bank_card_ui/issues
topics:
  - credit-card
  - payment
  - animation
  - bank-card
  - widget
screenshots:
  - description: A Visa Infinite card minting itself in 3D, then flipping and spinning.
    path: art/hero.webp
  - description: Every Visa and Mastercard tier, each in its own material.
    path: art/tiers.png
  - description: A wallet stack dealt from an API response; one card pulled out and flipped.
    path: art/wallet.webp
  - description: The live entry form stamping each digit onto the card.
    path: art/form.webp
  - description: Choose what shows; missing data is drawn as stars.
    path: art/privacy.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
