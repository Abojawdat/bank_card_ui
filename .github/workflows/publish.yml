name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: tag has to match pubspec
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "::error::tag ${GITHUB_REF_NAME} but pubspec says $version"; exit 1; }
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: dart pub publish --force
