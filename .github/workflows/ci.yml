name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test tool example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: dart pub publish --dry-run
